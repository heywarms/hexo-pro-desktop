<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexo Pro Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .status {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.success {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5a6fd8;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .project-info {
            text-align: left;
            margin: 1rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .project-info h3 {
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .project-info p {
            margin: 0.25rem 0;
            color: #666;
        }

        .update-panel {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #ddd;
            color: #444;
            font-size: 0.875rem;
            overflow-wrap: anywhere;
        }

        .update-panel .btn {
            padding: 0.5rem 0.75rem;
            margin: 0.75rem 0.25rem 0;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀 Hexo Pro</div>
        <div class="subtitle">桌面博客管理工具</div>
        
        <div id="status" class="status loading">
            <p>正在初始化...</p>
        </div>
        
        <div id="project-info" class="project-info" style="display: none;">
            <h3>当前项目</h3>
            <p id="project-path">路径: 未选择</p>
            <p id="project-status">状态: 未知</p>
        </div>
        
        <div id="actions">
            <button id="btn-open-project" class="btn">打开项目</button>
            <button id="btn-create-project" class="btn">新建项目</button>
        </div>
        <section id="update-panel" class="update-panel" aria-label="应用更新" hidden>
            <p id="update-status" role="status"></p>
            <button id="update-check" class="btn" disabled>检查更新</button>
            <button id="update-download" class="btn" hidden>下载更新</button>
            <button id="update-install" class="btn" hidden>重启安装</button>
        </section>
    </div>

    <script>
        class HexoProDesktop {
            constructor() {
                this.startTime = Date.now();
                this.connectionFailureCount = 0;
                // 冷启动阶段服务可能尚未监听端口，避免短暂闪现错误提示
                this.initialErrorGraceMs = 10000;
                this.pollingDelayMs = 1000;
                this.errorRetryDelayMs = 3000;
                this.init();
            }

            async init() {
                console.log('初始化 Hexo Pro Desktop...');
                await this.checkServerStatus();
                this.bindEvents();
            }

            async checkServerStatus() {
                const statusEl = document.getElementById('status');
                const elapsedMs = Date.now() - this.startTime;
                
                try {
                    const { serverUrl } = await window.electronAPI.getProjectInfo();
                    if (!serverUrl) throw new Error('当前应用的服务器尚未就绪');
                    const response = await fetch(new URL('/hexopro/api/desktop/status', serverUrl).href, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`服务器状态检查失败 (${response.status})`);
                    const data = await response.json();
                    this.connectionFailureCount = 0;
                    
                    console.log('服务器状态:', data);
                    
                    if (data.status === 'static-server') {
                        statusEl.className = 'status loading';
                        statusEl.innerHTML = '<p>✨ 服务器运行正常，请选择一个 Hexo 项目</p>';
                        
                        document.getElementById('btn-open-project').disabled = false;
                        document.getElementById('btn-create-project').disabled = false;
                    } else if (data.status === 'running' || data.hasProject) {
                        statusEl.className = 'status success';
                        statusEl.innerHTML = '<p>✅ 项目已加载，服务器运行中</p>';
                        
                        this.showProjectInfo(data);
                        document.getElementById('btn-open-project').disabled = false;
                        document.getElementById('btn-create-project').disabled = false;
                    } else {
                        statusEl.className = 'status loading';
                        statusEl.innerHTML = '<p>🔄 服务器正在启动...</p>';
                        
                        // 服务器还在启动中，1秒后重试
                        setTimeout(() => {
                            this.checkServerStatus();
                        }, this.pollingDelayMs);
                    }
                } catch (error) {
                    console.error('检查服务器状态失败:', error);
                    this.connectionFailureCount += 1;
                    const inGracePeriod = elapsedMs < this.initialErrorGraceMs;

                    const shouldShowError = !inGracePeriod && this.connectionFailureCount >= 2;

                    if (!shouldShowError) {
                        statusEl.className = 'status loading';
                        statusEl.innerHTML = '<p>🔄 正在连接服务器...</p>';
                    } else {
                        statusEl.className = 'status error';
                        statusEl.innerHTML = '<p>❌ 无法连接到服务器</p>';
                    }
                    
                    // 连接失败后持续重试，避免要求用户手动刷新
                    setTimeout(() => {
                        this.checkServerStatus();
                    }, this.errorRetryDelayMs);
                }
            }

            showProjectInfo(data) {
                const projectInfoEl = document.getElementById('project-info');
                const projectPathEl = document.getElementById('project-path');
                const projectStatusEl = document.getElementById('project-status');
                
                projectInfoEl.style.display = 'block';
                projectPathEl.textContent = `路径: ${data.projectPath || '未知'}`;
                projectStatusEl.textContent = `状态: ${data.hasProject ? '已加载' : '未加载'}`;
            }

            bindEvents() {
                document.getElementById('btn-open-project').onclick = () => {
                    if (window.electronAPI) {
                        window.electronAPI.openProject();
                    } else {
                        alert('请使用菜单 "文件 → 打开博客项目"');
                    }
                };

                document.getElementById('btn-create-project').onclick = () => {
                    if (window.electronAPI) {
                        window.electronAPI.createProject();
                    } else {
                        alert('请使用菜单 "文件 → 新建博客项目"');
                    }
                };

                // 监听项目加载事件
                if (window.electronAPI) {
                    window.electronAPI.onProjectLoaded((projectInfo) => {
                        console.log('项目已加载，应该已自动跳转到Web界面:', projectInfo);
                        // 不需要手动检查状态，因为main.js会自动调用loadWebInterface
                    });
                }
            }
        }

        // 当页面加载完成时初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new HexoProDesktop();
        });
    </script>
    <script src="updater.js"></script>
</body>
</html>
